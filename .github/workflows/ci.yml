name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the auto-merge workflow run CI on main after it merges a PR.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - name: Check auth test coverage
        run: ./scripts/check_auth_tests.sh

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: error

  deny:
    name: dependency-audit

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all --all-targets

  build:
    name: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses

  build:
    name: build-wasm-${{ matrix.build }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32v1-none
      - uses: stellar/stellar-cli@v27.0.0
      - run: stellar contract build
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.build }}
          path: target/wasm32v1-none/release/*.wasm

  verify-wasm:
    name: verify-wasm-reproducibility
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasm-1
          path: wasm-1
      - uses: actions/download-artifact@v4
        with:
          name: wasm-2
          path: wasm-2
      - name: Compare wasm SHA-256 hashes
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files_1 < <(find wasm-1 -type f -name '*.wasm' -printf '%P\n' | sort)
          mapfile -t files_2 < <(find wasm-2 -type f -name '*.wasm' -printf '%P\n' | sort)
          if ((${#files_1[@]} == 0)); then
            echo "No wasm files found in build 1" >&2
            exit 1
          fi
          if [[ "${files_1[*]}" != "${files_2[*]}" ]]; then
            echo "Wasm file sets differ between builds" >&2
            printf 'Build 1: %s\nBuild 2: %s\n' "${files_1[*]}" "${files_2[*]}" >&2
            exit 1
          fi

          mismatch=0
          {
            echo '### Reproducible wasm build (SHA-256)'
            echo '| Artifact | Build 1 | Build 2 |'
            echo '| --- | --- | --- |'
            for file in "${files_1[@]}"; do
              hash_1=$(sha256sum "wasm-1/$file" | cut -d ' ' -f 1)
              hash_2=$(sha256sum "wasm-2/$file" | cut -d ' ' -f 1)
              printf '| `%s` | `%s` | `%s` |\n' "$file" "$hash_1" "$hash_2"
              if [[ "$hash_1" != "$hash_2" ]]; then
                mismatch=1
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if ((mismatch)); then
            echo "Wasm builds are not reproducible" >&2
            exit 1
          fi
