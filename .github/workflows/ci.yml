name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the auto-merge workflow run CI on main after it merges a PR.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - name: Check auth test coverage
        run: ./scripts/check_auth_tests.sh

  resource-budgets:
    name: resource-budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Measure per-call contract resources
        run: bash scripts/check_resource_budgets.sh

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: error

  deny:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all --all-targets

  build:
    name: build-wasm-${{ matrix.build }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32v1-none
      - uses: stellar/stellar-cli@v30.0.1
      - run: stellar contract build
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-${{ matrix.build }}
          path: |
            target/wasm32v1-none/release/payflow_plan_registry.wasm
            target/wasm32v1-none/release/payflow_subscription.wasm
            target/wasm32v1-none/release/payflow_vault.wasm
          if-no-files-found: error

  verify-wasm:
    name: verify-wasm-reproducibility
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wasm-1
          path: wasm-1
      - uses: actions/download-artifact@v8
        with:
          name: wasm-2
          path: wasm-2
      - name: Compare wasm SHA-256 hashes
        shell: bash
        run: |
          set -euo pipefail

          expected_files=(
            payflow_plan_registry.wasm
            payflow_subscription.wasm
            payflow_vault.wasm
          )
          mapfile -t files_1 < <(find wasm-1 -type f -name '*.wasm' -printf '%P\n' | sort)
          mapfile -t files_2 < <(find wasm-2 -type f -name '*.wasm' -printf '%P\n' | sort)
          if [[ "${files_1[*]}" != "${expected_files[*]}" ]]; then
            echo "Build 1 did not produce exactly the three deployable Payflow contracts" >&2
            printf 'Expected: %s\nFound: %s\n' "${expected_files[*]}" "${files_1[*]}" >&2
            exit 1
          fi
          if [[ "${files_2[*]}" != "${expected_files[*]}" ]]; then
            echo "Build 2 did not produce exactly the three deployable Payflow contracts" >&2
            printf 'Expected: %s\nFound: %s\n' "${expected_files[*]}" "${files_2[*]}" >&2
            exit 1
          fi

          mismatch=0
          {
            echo '### Reproducible wasm build (SHA-256)'
            echo '| Artifact | Build 1 | Build 2 |'
            echo '| --- | --- | --- |'
            for file in "${expected_files[@]}"; do
              hash_1=$(sha256sum "wasm-1/$file" | cut -d ' ' -f 1)
              hash_2=$(sha256sum "wasm-2/$file" | cut -d ' ' -f 1)
              printf '| `%s` | `%s` | `%s` |\n' "$file" "$hash_1" "$hash_2"
              if [[ "$hash_1" != "$hash_2" ]]; then
                mismatch=1
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if ((mismatch)); then
            echo "Wasm builds are not reproducible" >&2
            exit 1
          fi
