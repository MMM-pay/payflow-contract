name: TypeScript bindings

on:
  pull_request:
    branches: [main]
    paths:
      - "bindings/**"
      - "contracts/**"
      - "scripts/generate-bindings.sh"
      - ".github/workflows/bindings.yml"
  push:
    branches: [main]
    paths:
      - "bindings/**"
      - "contracts/**"
      - "scripts/generate-bindings.sh"
      - ".github/workflows/bindings.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/stellar-cli@v27.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - run: stellar contract build
      - run: ./scripts/generate-bindings.sh
      - run: npm ci --prefix bindings
      - run: npm test --prefix bindings
      - name: Set package version from release tag
        if: github.event_name == 'release'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --prefix bindings
      - name: Publish package
        if: github.event_name == 'release'
        run: npm publish --prefix bindings --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}