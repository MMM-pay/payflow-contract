[package]
name = "payflow-subscription"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false

[lib]
crate-type = ["lib", "cdylib"]
name = "payflow_subscription"
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
payflow-shared = { path = "../shared" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
payflow-plan-registry = { path = "../plan-registry" }
payflow-vault = { path = "../vault" }
payflow-test-token = { path = "../test-token" }
