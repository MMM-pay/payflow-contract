[advisories]
version = 2
ignore = [
    # `paste` is unmaintained but has no known vulnerability. It reaches the
    # build only through soroban-sdk's own dependencies, so it goes away when
    # the SDK drops it, not through anything this workspace can change.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, no vulnerability; pulled in by soroban-sdk" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
